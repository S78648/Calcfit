server:
  port: 8060

spring:
  application:
    name: calcfitPro
  profiles:
    default: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      secret: ${JWT_SECRET}
      accessTokenTtlSeconds: ${JWT_ACCESS_TTL_SECONDS}
      refreshTokenTtlSeconds: ${JWT_REFRESH_TTL_SECONDS}


